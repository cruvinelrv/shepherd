name: Build & Release Standalone Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.12.0)'
        required: false
        default: 'v0.12.0'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: shepherd-macos-arm64
            binary: shepherd
            archive: shepherd-macos-arm64.tar.gz
          - os: ubuntu-latest
            target: shepherd-linux-x64
            binary: shepherd
            archive: shepherd-linux-x64.tar.gz
          - os: windows-latest
            target: shepherd-windows-x64
            binary: shepherd.exe
            archive: shepherd-windows-x64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get --no-example

      - name: Compile Standalone Native Binary (CLI Bundle)
        run: dart build cli -o dist_build

      # The executable lives only in bin/: it loads its native libraries (SQLite,
      # needed by RAG) from ../lib, which resolves for bin/<exe> but not for a
      # copy placed at the top of the archive.
      - name: Package Binary (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          cd dist_build/bundle
          chmod +x bin/${{ matrix.binary }}
          tar -czvf ../../${{ matrix.archive }} bin lib
          cd ../..
          shasum -a 256 ${{ matrix.archive }} > ${{ matrix.archive }}.sha256

      - name: Smoke test packaged binary (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          set -e
          SMOKE=$(mktemp -d)
          tar -xzf ${{ matrix.archive }} -C "$SMOKE"
          if [ -e "$SMOKE/${{ matrix.binary }}" ]; then
            echo "A top-level executable must not be shipped (its ../lib would be wrong)"; exit 1
          fi
          WS=$(mktemp -d)
          echo "# nota" > "$WS/a.md"
          cd "$WS"
          "$SMOKE/bin/${{ matrix.binary }}" version
          "$SMOKE/bin/${{ matrix.binary }}" ai index --force
          if [ ! -f "$WS/.shepherd/vectors/embeddings.db" ]; then
            echo "RAG index was not created: the native SQLite library was not found next to the binary"; exit 1
          fi

      - name: Package Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd dist_build/bundle
          Compress-Archive -Path "bin", "lib" -DestinationPath "..\..\${{ matrix.archive }}" -Force
          cd ..\..
          (Get-FileHash -Algorithm SHA256 ${{ matrix.archive }}).Hash.ToLower() + "  ${{ matrix.archive }}" | Out-File -Encoding utf8 ${{ matrix.archive }}.sha256

      # Not verified on Windows yet, so a failure here warns instead of blocking
      # the whole release; tighten it once it has run green.
      - name: Smoke test packaged binary (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP "smoke"
          Expand-Archive -Path ${{ matrix.archive }} -DestinationPath $smoke -Force
          if (Test-Path "$smoke\${{ matrix.binary }}") { throw "A top-level executable must not be shipped" }
          $ws = Join-Path $env:RUNNER_TEMP "ws"
          New-Item -ItemType Directory -Path $ws -Force | Out-Null
          "# nota" | Out-File -Encoding utf8 "$ws\a.md"
          Set-Location $ws
          & "$smoke\bin\${{ matrix.binary }}" version
          & "$smoke\bin\${{ matrix.binary }}" ai index --force
          if (-not (Test-Path "$ws\.shepherd\vectors\embeddings.db")) { throw "RAG index was not created: native SQLite not found next to the binary" }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  release:
    name: Publish Release & Assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Consolidated Checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS.txt
          cp ../scripts/install.sh .
          cp ../scripts/install.ps1 .
          ls -la

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || inputs.tag || 'v0.12.0' }}
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

