name: Build & Release Standalone Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.12.0)'
        required: false
        default: 'v0.12.0'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: shepherd-macos-arm64
            binary: shepherd
            archive: shepherd-macos-arm64.tar.gz
          - os: macos-13
            target: shepherd-macos-x64
            binary: shepherd
            archive: shepherd-macos-x64.tar.gz
          - os: ubuntu-latest
            target: shepherd-linux-x64
            binary: shepherd
            archive: shepherd-linux-x64.tar.gz
          - os: windows-latest
            target: shepherd-windows-x64
            binary: shepherd.exe
            archive: shepherd-windows-x64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get --no-example

      - name: Compile Standalone Native Binary (CLI Bundle)
        run: dart build cli -o dist_build

      - name: Package Binary (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          cd dist_build/bundle
          cp bin/${{ matrix.binary }} .
          chmod +x bin/${{ matrix.binary }} ${{ matrix.binary }}
          tar -czvf ../../${{ matrix.archive }} ${{ matrix.binary }} bin lib
          cd ../..
          shasum -a 256 ${{ matrix.archive }} > ${{ matrix.archive }}.sha256

      - name: Package Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd dist_build/bundle
          Copy-Item "bin\${{ matrix.binary }}" -Destination "."
          Compress-Archive -Path "${{ matrix.binary }}", "bin", "lib" -DestinationPath "..\..\${{ matrix.archive }}" -Force
          cd ..\..
          (Get-FileHash -Algorithm SHA256 ${{ matrix.archive }}).Hash.ToLower() + "  ${{ matrix.archive }}" | Out-File -Encoding utf8 ${{ matrix.archive }}.sha256

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  release:
    name: Publish Release & Assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Consolidated Checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS.txt
          cp ../scripts/install.sh .
          cp ../scripts/install.ps1 .
          ls -la

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || inputs.tag || 'v0.12.0' }}
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

